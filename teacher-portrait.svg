    <path d="M325 347C334 337 352 337 363 347C354 357 335 357 325 347Z" fill="#fffaf1"/>
    <path d="M397 347C407 337 425 337 435 347C425 357 406 357 397 347Z" fill="#fffaf1"/>
    <circle cx="346" cy="347" r="7.2" fill="#2e2822"/>
    <circle cx="414" cy="347" r="7.2" fill="#2e2822"/>
    <circle cx="343.5" cy="344" r="2.1" fill="#fffdf7"/>
    <circle cx="411.5" cy="344" r="2.1" fill="#fffdf7"/>
    <path d="M325 346C335 334 353 334 363 345" fill="none" stroke="#3b2f28" stroke-width="4" stroke-linecap="round"/>
    <path d="M397 345C408 334 426 334 436 346" fill="none" stroke="#3b2f28" stroke-width="4" stroke-linecap="round"/>
    <path d="M326 346L320 342M362 345L368 341M398 345L392 341M435 346L441 342" stroke="#3b2f28" stroke-width="2" stroke-linecap="round"/>

