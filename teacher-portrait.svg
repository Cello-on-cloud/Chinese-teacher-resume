    <path d="M380 355C377 373 373 386 369 394C375 400 385 401 392 396" fill="none" stroke="#bd7f5e" stroke-width="3" stroke-linecap="round"/>
    <path d="M353 420C366 432 394 432 408 419C396 442 366 442 353 420Z" fill="#b96058"/>
    <path d="M353 420C367 426 394 426 408 419" fill="none" stroke="#8f4945" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="320" cy="389" rx="24" ry="13" fill="#d98c76" opacity="0.22"/>
    <ellipse cx="440" cy="389" rx="24" ry="13" fill="#d98c76" opacity="0.22"/>

