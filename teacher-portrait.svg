    <circle cx="380" cy="625" r="3.8" fill="#c89b52"/>
    <path d="M344 552C333 583 319 609 294 632M416 552C427 583 441 609 466 632" fill="none" stroke="#3c6a60" stroke-width="2.5" opacity="0.7"/>

    <!-- Arms crossed at the base -->
    <path d="M206 808C241 770 300 764 343 788L380 808L415 788C458 764 517 770 553 808C573 830 577 858 567 900H194C184 858 188 830 206 808Z" fill="url(#blazer)"/>
    <path d="M343 788C310 789 282 803 264 824C245 847 246 873 263 886C281 899 304 892 321 874L357 833L380 808Z" fill="#e9bb92"/>
    <path d="M417 788C450 789 478 803 496 824C515 847 514 873 497 886C479 899 456 892 439 874L403 833L380 808Z" fill="#e9bb92"/>
    <path d="M272 827C288 822 307 830 319 847C329 861 329 877 320 887" fill="none" stroke="#c48f68" stroke-width="2.4"/>
    <path d="M488 827C472 822 453 830 441 847C431 861 431 877 440 887" fill="none" stroke="#c48f68" stroke-width="2.4"/>
    <path d="M322 887C338 880 356 887 363 900H301C306 894 313 890 322 887Z" fill="#e9bb92"/>
    <path d="M438 887C422 880 404 887 397 900H459C454 894 447 890 438 887Z" fill="#e9bb92"/>

    <!-- Notebook -->
    <g transform="rotate(-4 380 830)" filter="url(#softShadow)">
      <rect x="288" y="786" width="184" height="120" rx="8" fill="#fbf3e2"/>
      <rect x="288" y="786" width="24" height="120" rx="8" fill="#d8896b"/>
      <path d="M330 821H438M330 843H420M330 865H398" stroke="#2f6f65" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
      <rect x="404" y="806" width="45" height="45" rx="4" fill="#2f6f65"/>
      <text x="426.5" y="838" font-family="Georgia, serif" font-size="25" fill="#f8f2e7" text-anchor="middle">汉</text>
    </g>

    <!-- Small decorative marks -->
    <g fill="#2f6f65" opacity="0.55">
      <path d="M163 285L167 297L179 301L167 305L163 317L159 305L147 301L159 297Z"/>
      <circle cx="616" cy="405" r="4"/>
      <circle cx="612" cy="424" r="2.5"/>
    </g>
    <path d="M138 357C165 347 189 353 209 372" fill="none" stroke="#d8896b" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

    <!-- Grain -->
    <rect width="760" height="900" filter="url(#grain)" opacity="0.9"/>
  </g>
</svg>
