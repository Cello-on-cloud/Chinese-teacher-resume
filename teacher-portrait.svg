    <path d="M271 391C259 404 260 423 273 430C285 423 285 404 274 391" fill="none" stroke="#c89b52" stroke-width="4"/>
    <path d="M488 391C500 404 499 423 486 430C474 423 474 404 485 391" fill="none" stroke="#c89b52" stroke-width="4"/>

