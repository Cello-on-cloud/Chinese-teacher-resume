    <path d="M328 545C283 563 247 594 226 642C204 692 194 794 192 900H568C566 794 556 692 534 642C513 594 477 563 432 545L380 596Z" fill="#f2e4d0"/>
    <path d="M380 596L328 545C288 561 254 586 230 626L318 708L380 642L442 708L530 626C506 586 472 561 432 545Z" fill="url(#blazer)"/>
    <path d="M328 545L380 596L432 545C415 536 401 529 380 529C359 529 345 536 328 545Z" fill="#e8d4bc"/>
