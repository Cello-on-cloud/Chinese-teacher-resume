<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 900" role="img" aria-labelledby="portraitTitle portraitDesc">
  <title id="portraitTitle">Illustrated portrait of Chinese teacher Lin Zhixia</title>
  <desc id="portraitDesc">A warm editorial illustration of a Chinese language teacher with a dark bob, cream blouse and teal blazer, set against a soft blue-green arch.</desc>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9e9e0"/>
      <stop offset="1" stop-color="#b9d4c9"/>
    </linearGradient>
    <linearGradient id="archWash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf4e8"/>
      <stop offset="1" stop-color="#f2e6d2"/>
    </linearGradient>
    <linearGradient id="blazer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c5d54"/>
      <stop offset="1" stop-color="#1e453f"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#efc7a2"/>
      <stop offset="1" stop-color="#e2ae84"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c3b36"/>
      <stop offset="1" stop-color="#182824"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#153f38" flood-opacity="0.20"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.045"/>
      </feComponentTransfer>
    </filter>
    <clipPath id="frameClip">
      <path d="M0 0H760V900H0Z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frameClip)">
    <rect width="760" height="900" fill="url(#wash)"/>

    <!-- Painted backdrop -->
    <circle cx="604" cy="206" r="178" fill="#e7b878" opacity="0.52"/>
    <path d="M76 900V324C76 187 187 76 324 76H436C573 76 684 187 684 324V900Z" fill="url(#archWash)"/>
    <path d="M108 900V334C108 209 209 108 334 108H426C551 108 652 209 652 334V900" fill="none" stroke="#244f48" stroke-opacity="0.18" stroke-width="2"/>
    <circle cx="380" cy="372" r="252" fill="none" stroke="#2f6f65" stroke-opacity="0.10" stroke-width="1.5" stroke-dasharray="3 9"/>

    <!-- Abstract leaves -->
    <g fill="none" stroke="#2f6f65" stroke-opacity="0.30" stroke-width="2">
      <path d="M114 615C156 568 185 510 190 451"/>
      <path d="M145 574C130 548 124 526 128 502C153 509 169 528 173 550"/>
      <path d="M165 531C156 504 158 482 168 460C188 477 195 497 190 517"/>
      <path d="M644 666C624 611 620 551 631 492"/>
      <path d="M634 600C651 578 660 557 660 535C637 539 622 555 615 574"/>
      <path d="M628 545C625 518 631 496 645 478C660 498 663 519 655 538"/>
    </g>

