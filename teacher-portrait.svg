    <path d="M265 393C242 286 294 189 385 181C481 172 541 243 526 360C519 417 531 478 560 537C575 568 564 608 534 626C508 642 478 627 464 596C448 561 438 507 433 458L329 458C322 513 311 558 293 593C274 629 239 640 213 619C190 601 190 567 203 536C227 480 251 445 265 393Z" fill="url(#hair)"/>
    <circle cx="523" cy="220" r="47" fill="#1f312c"/>
    <path d="M499 205C507 184 528 174 548 181C563 186 573 200 574 217C553 225 525 224 499 205Z" fill="#3a4a44" opacity="0.75"/>

